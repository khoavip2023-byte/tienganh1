<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tiếng Anh Thật Vui — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --teal:#348C90;--teal2:#2b7478;--bg:#f5f7f8;--card:#fff;--text:#193238;
  --muted:#718087;--line:#e3e9eb;--danger:#d9534f;--warn:#d99000;--ok:#2e8b57;
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);
font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;
padding:28px;box-shadow:0 12px 40px #163b4212}
.logo{font-size:24px;font-weight:800;color:var(--teal);margin-bottom:6px}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:24px}
label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #348c9014}
textarea{min-height:100px;resize:vertical}
.field{margin-bottom:14px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.btn-primary{background:var(--teal);color:white}.btn-primary:hover{background:var(--teal2)}
.btn-light{background:#eef3f4;color:var(--text)}.btn-danger{background:#fff0ef;color:var(--danger)}
.btn-warn{background:#fff7df;color:#9b6900}.btn-sm{padding:7px 10px;font-size:12px}
#error{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px}
#app{display:none;min-height:100vh}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);
display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}
.brand{font-weight:800;color:var(--teal)}.userbox{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:#e2f1f1;color:var(--teal);
display:grid;place-items:center;font-weight:800}
.layout{display:flex;min-height:calc(100vh - 64px)}.sidebar{width:225px;background:#fff;border-right:1px solid var(--line);
padding:14px 10px;flex:none}.nav{display:flex;flex-direction:column;gap:3px}
.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:9px;color:#52636a}
.nav button:hover,.nav button.active{background:#e8f3f3;color:var(--teal);font-weight:700}
.main{padding:22px;min-width:0;flex:1}.page-head{display:flex;align-items:center;justify-content:space-between;
gap:12px;margin-bottom:18px}.page-title{font-size:24px;font-weight:800}.page-sub{font-size:13px;color:var(--muted);margin-top:3px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px}.stat .n{font-size:27px;font-weight:800;margin-top:4px}
.stat .l{font-size:12px;color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel-title{font-weight:800}.tools{display:flex;gap:8px;flex-wrap:wrap}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{padding:11px 12px;border-bottom:1px solid #edf0f1;text-align:left;white-space:nowrap;vertical-align:top}
.table th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#fafbfb}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}
.b-ok{background:#e7f6ed;color:#237247}.b-off{background:#eef1f2;color:#657278}.b-warn{background:#fff4d9;color:#966800}
.b-blue{background:#e8f1ff;color:#3567a5}.b-red{background:#ffebea;color:#b23c38}
.empty{padding:35px;text-align:center;color:var(--muted);font-size:13px}.loading{padding:25px;text-align:center;color:var(--muted)}
.modal-back{position:fixed;inset:0;background:#10262b80;display:none;align-items:center;justify-content:center;
padding:18px;z-index:100}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;
box-shadow:0 20px 80px #0004}.modal-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.modal-body{padding:18px}.modal-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.close{border:0;background:transparent;font-size:22px;color:var(--muted)}
.toast{position:fixed;right:18px;bottom:18px;background:#193238;color:#fff;padding:12px 15px;border-radius:10px;
font-size:13px;display:none;z-index:200;max-width:360px}.toast.bad{background:#a93632}
.search{max-width:260px}.danger-note{font-size:12px;color:var(--danger);margin-top:5px}
.mobile-menu{display:none}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.sidebar{width:190px}}
@media(max-width:650px){
 .topbar{padding:0 12px}.mobile-menu{display:block}.layout{display:block}.sidebar{width:100%;display:none;border-right:0;border-bottom:1px solid var(--line)}
 .sidebar.open{display:block}.main{padding:14px}.cards{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}
 .page-title{font-size:20px}.userbox span{display:none}
}
</style>
</head>
<body>

<section id="login">
  <div class="login-card">
    <div class="logo">TIẾNG ANH THẬT VUI</div>
    <div class="subtitle">Khu vực quản trị LMS</div>
    <form id="loginForm">
      <div class="field"><label>Email quản trị</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label>Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" style="width:100%">Đăng nhập</button>
      <div id="error"></div>
    </form>
  </div>
</section>

<section id="app">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn btn-light mobile-menu" onclick="toggleSide()">☰</button>
      <div class="brand">TIẾNG ANH THẬT VUI · ADMIN</div>
    </div>
    <div class="userbox">
      <div class="avatar" id="avatar">A</div><span id="adminName">Admin</span>
      <button class="btn btn-light btn-sm" onclick="logout()">Đăng xuất</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="nav">
        <button data-page="dashboard" onclick="go('dashboard')">📊 Tổng quan</button>
        <button data-page="students" onclick="go('students')">👨‍🎓 Học sinh</button>
        <button data-page="teachers" onclick="go('teachers')">👩‍🏫 Giáo viên</button>
        <button data-page="classes" onclick="go('classes')">🏫 Lớp học</button>
        <button data-page="lessons" onclick="go('lessons')">📅 Buổi học</button>
        <button data-page="assignments" onclick="go('assignments')">📝 Bài tập</button>
        <button data-page="submissions" onclick="go('submissions')">🎯 Bài nộp</button>
        <button data-page="videos" onclick="go('videos')">🎬 Video tháng</button>
        <button data-page="tuition" onclick="go('tuition')">💳 Học phí</button>
        <button data-page="feedbacks" onclick="go('feedbacks')">💬 Hỏi đáp</button>
        <button data-page="announcements" onclick="go('announcements')">📢 Thông báo</button>
      </div>
    </aside>
    <main class="main" id="content"></main>
  </div>
</section>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <div class="modal-head"><div id="modalTitle" style="font-weight:800">Biểu mẫu</div><button class="close" onclick="closeModal()">×</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot"><button class="btn btn-light" onclick="closeModal()">Hủy</button><button class="btn btn-primary" id="modalSave">Lưu</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   1. CẤU HÌNH SUPABASE
   Thay đúng 2 giá trị dưới đây.
   KHÔNG BAO GIỜ dán service_role key vào HTML.
   ========================================================= */
const SUPABASE_URL = "https://cafevcfsoabxvtralomc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_RJq7Z9XLRg-HLaKZXPPdeQ_GWF0UtUF";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentPage = "dashboard";
let cache = {profiles:[],classes:[],assignments:[]};

const esc = v => String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const short = v => {
  const s=String(v??""); return s.length>45 ? s.slice(0,45)+"…" : s;
};
const fmtDate = v => v ? new Date(v).toLocaleDateString("vi-VN") : "—";
const fmtDateTime = v => v ? new Date(v).toLocaleString("vi-VN") : "—";
const badge = (text, cls="b-off") => `<span class="badge ${cls}">${esc(text)}</span>`;

function toast(msg,bad=false){
  const t=document.getElementById("toast"); t.textContent=msg; t.className="toast"+(bad?" bad":"");
  t.style.display="block"; clearTimeout(window.__toast); window.__toast=setTimeout(()=>t.style.display="none",2800);
}
function toggleSide(){document.getElementById("sidebar").classList.toggle("open")}
function closeModal(){document.getElementById("modalBack").style.display="none"}
function openModal(title,html,onSave){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=html;
  document.getElementById("modalBack").style.display="flex";
  document.getElementById("modalSave").onclick=async()=>{await onSave()};
}
function formVal(id){return document.getElementById(id)?.value?.trim() ?? ""}
function formNum(id){const v=formVal(id);return v===""?null:Number(v)}

async function ensureAdmin(){
  const {data:{user},error}=await db.auth.getUser();
  if(error || !user) return false;
  const {data:p,error:e}=await db.from("profiles").select("id,full_name,login_name,role,is_active,is_deleted").eq("id",user.id).maybeSingle();
  if(e || !p || p.role!=="admin" || !p.is_active || p.is_deleted) {
    await db.auth.signOut();
    return false;
  }
  currentUser=user;
  document.getElementById("adminName").textContent=p.full_name || user.email;
  document.getElementById("avatar").textContent=(p.full_name||"A").charAt(0).toUpperCase();
  return true;
}

async function boot(){
  const ok=await ensureAdmin();
  if(ok){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";go("dashboard")}
}
document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault(); document.getElementById("error").textContent="Đang đăng nhập…";
  const {error}=await db.auth.signInWithPassword({email:formVal("email"),password:formVal("password")});
  if(error){document.getElementById("error").textContent=error.message;return}
  if(!(await ensureAdmin())){document.getElementById("error").textContent="Tài khoản không có quyền admin.";return}
  document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";go("dashboard");
});
async function logout(){await db.auth.signOut();location.reload()}

function navActive(page){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
}
async function go(page){
  currentPage=page;navActive(page);document.getElementById("sidebar").classList.remove("open");
  const c=document.getElementById("content");c.innerHTML='<div class="loading">Đang tải…</div>';
  try{
    if(page==="dashboard") return await renderDashboard();
    if(page==="students") return await renderProfiles("student");
    if(page==="teachers") return await renderProfiles("teacher");
    if(page==="classes") return await renderClasses();
    if(page==="lessons") return await renderLessons();
    if(page==="assignments") return await renderAssignments();
    if(page==="submissions") return await renderSubmissions();
    if(page==="videos") return await renderVideos();
    if(page==="tuition") return await renderTuition();
    if(page==="feedbacks") return await renderFeedbacks();
    if(page==="announcements") return await renderAnnouncements();
  }catch(e){console.error(e);c.innerHTML=`<div class="panel"><div class="empty">Không tải được dữ liệu.<br><small>${esc(e.message)}</small></div></div>`}
}

async function count(table, extra){
  let q=db.from(table).select("*",{count:"exact",head:true});
  if(extra) q=extra(q); const {count,error}=await q; if(error) throw error; return count||0;
}
async function renderDashboard(){
  const [students,teachers,classes,tuition,feedbacks]=await Promise.all([
    count("profiles",q=>q.eq("role","student").eq("is_deleted",false)),
    count("profiles",q=>q.eq("role","teacher").eq("is_deleted",false)),
    count("classes",q=>q.eq("is_active",true)),
    count("tuition_requests",q=>q.eq("status","pending")),
    count("feedbacks",q=>q.eq("status","pending"))
  ]);
  const {data:recent}=await db.from("tuition_requests").select("id,student_id,months,status,created_at,transaction_code").order("created_at",{ascending:false}).limit(8);
  let ids=(recent||[]).map(x=>x.student_id);
  let names={};
  if(ids.length){const {data:p}=await db.from("profiles").select("id,full_name,login_name").in("id",ids);(p||[]).forEach(x=>names[x.id]=x)}
  document.getElementById("content").innerHTML=`
    <div class="page-head"><div><div class="page-title">Tổng quan</div><div class="page-sub">Quản lý toàn bộ hệ thống LMS</div></div></div>
    <div class="cards">
      ${stat(students,"Học sinh")} ${stat(teachers,"Giáo viên")} ${stat(classes,"Lớp đang hoạt động")} ${stat(tuition,"Yêu cầu học phí")}
    </div>
    <div class="cards">${stat(feedbacks,"Câu hỏi chưa trả lời")} ${stat(await count("assignments"),"Tổng bài tập")} ${stat(await count("submissions"),"Tổng bài nộp")} ${stat(await count("monthly_videos"),"Video tháng")}</div>
    <div class="panel"><div class="panel-head"><div class="panel-title">Yêu cầu học phí gần đây</div><button class="btn btn-light btn-sm" onclick="go('tuition')">Xem tất cả</button></div>
    <div class="table-wrap">${recent?.length?`<table class="table"><thead><tr><th>Học sinh</th><th>Tháng</th><th>Mã GD</th><th>Trạng thái</th><th>Ngày</th></tr></thead><tbody>
    ${recent.map(x=>`<tr><td>${esc(names[x.student_id]?.full_name||names[x.student_id]?.login_name||x.student_id.slice(0,8))}</td><td>${x.months}</td><td>${esc(x.transaction_code||"—")}</td><td>${statusBadge(x.status)}</td><td>${fmtDateTime(x.created_at)}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">Chưa có yêu cầu.</div>`}</div></div>`;
}
function stat(n,l){return `<div class="stat"><div class="l">${l}</div><div class="n">${n}</div></div>`}
function statusBadge(s){
  const map={active:["Đang hoạt động","b-ok"],inactive:["Đang ẩn","b-off"],pending:["Chờ xử lý","b-warn"],approved:["Đã duyệt","b-ok"],rejected:["Từ chối","b-red"],draft:["Nháp","b-off"],published:["Đã đăng","b-ok"],closed:["Đã đóng","b-blue"],answered:["Đã trả lời","b-ok"]};
  const a=map[s]||[s,"b-off"];return badge(a[0],a[1]);
}

async function getProfiles(role){
  let q=db.from("profiles").select("id,full_name,login_name,role,class_id,expired_at,is_active,is_deleted,created_at,updated_at").eq("role",role).order("created_at",{ascending:false});
  const {data,error}=await q;if(error)throw error;return data||[];
}
async function getClasses(){
  const {data,error}=await db.from("classes").select("id,class_name,teacher_id,is_active,created_at").order("created_at",{ascending:false});
  if(error)throw error;return data||[];
}
async function renderProfiles(role){
  const data=await getProfiles(role);cache.profiles=data;
  const classes=await getClasses();cache.classes=classes;const cm={};classes.forEach(c=>cm[c.id]=c.class_name);
  const title=role==="student"?"Học sinh":"Giáo viên";
  document.getElementById("content").innerHTML=`
    <div class="page-head"><div><div class="page-title">${title}</div><div class="page-sub">${data.length} tài khoản</div></div>
    <div class="tools"><input class="search" id="profileSearch" placeholder="Tìm tên / tài khoản…" oninput="filterTable('profileTable',this.value)">${role==="student"?'<button class="btn btn-primary" onclick="studentForm()">+ Thêm hồ sơ</button>':'<button class="btn btn-primary" onclick="teacherForm()">+ Thêm hồ sơ</button>'}</div></div>
    <div class="panel"><div class="table-wrap"><table class="table" id="profileTable"><thead><tr><th>Họ tên</th><th>Tài khoản</th><th>Lớp</th><th>Hạn học phí</th><th>Trạng thái</th><th>Tạo lúc</th><th></th></tr></thead><tbody>
    ${data.length?data.map(p=>`<tr data-search="${esc((p.full_name+" "+p.login_name).toLowerCase())}">
      <td><b>${esc(p.full_name)}</b></td><td>${esc(p.login_name)}</td><td>${esc(cm[p.class_id]||"Chưa xếp lớp")}</td>
      <td>${p.expired_at?fmtDate(p.expired_at):"Không hạn"}</td>
      <td>${p.is_deleted?badge("Đã xóa","b-red"):p.is_active?badge("Đang hoạt động","b-ok"):badge("Đang ẩn","b-off")}</td>
      <td>${fmtDate(p.created_at)}</td><td><button class="btn btn-light btn-sm" onclick="editProfile('${p.id}')">Sửa</button></td>
    </tr>`).join(""):`<tr><td colspan="7"><div class="empty">Chưa có hồ sơ.</div></td></tr>`}
    </tbody></table></div></div>`;
}
function filterTable(id,value){
  const v=value.toLowerCase().trim();document.querySelectorAll("#"+id+" tbody tr").forEach(tr=>tr.style.display=(!v||tr.dataset.search?.includes(v))?"":"none")
}

function classOptions(selected=""){
  return `<option value="">— Chưa xếp lớp —</option>`+cache.classes.map(c=>`<option value="${c.id}" ${c.id===selected?"selected":""}>${esc(c.class_name)}${c.is_active?"":" (ẩn)"}</option>`).join("")
}
async function studentForm(id=null){
  const p=id?cache.profiles.find(x=>x.id===id):null;
  if(id&&!p){const {data}=await db.from("profiles").select("*").eq("id",id).single();Object.assign(cache.profiles,{})}
  openModal(p?"Sửa học sinh":"Thêm hồ sơ học sinh",`
    <div class="grid2">
      <div class="field"><label>Họ và tên</label><input id="f_full" value="${esc(p?.full_name)}"></div>
      <div class="field"><label>Tài khoản login_name</label><input id="f_login" value="${esc(p?.login_name)}" ${p?"disabled":""}></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Lớp</label><select id="f_class">${classOptions(p?.class_id)}</select></div>
      <div class="field"><label>Hạn học phí</label><input id="f_expired" type="datetime-local" value="${toLocalInput(p?.expired_at)}"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Đang hoạt động</label><select id="f_active"><option value="true" ${p?.is_active!==false?"selected":""}>Có</option><option value="false" ${p?.is_active===false?"selected":""}>Không</option></select></div>
      <div class="field"><label>Đã xóa logic</label><select id="f_deleted"><option value="false" ${!p?.is_deleted?"selected":""}>Không</option><option value="true" ${p?.is_deleted?"selected":""}>Có</option></select></div>
    </div>
    ${!p?'<div class="danger-note">Lưu ý: form này chỉ tạo hồ sơ profile. Auth user phải được tạo trước bằng Supabase Authentication/Worker.</div>':""}
  `,async()=>{
    const payload={full_name:formVal("f_full"),class_id:formVal("f_class")||null,expired_at:formVal("f_expired")?new Date(formVal("f_expired")).toISOString():null,is_active:formVal("f_active")==="true",is_deleted:formVal("f_deleted")==="true"};
    if(!payload.full_name){toast("Vui lòng nhập họ tên.",true);return}
    let r;
    if(p) r=await db.from("profiles").update(payload).eq("id",p.id);
    else {
      payload.login_name=formVal("f_login");payload.role="student";
      if(!payload.login_name){toast("Vui lòng nhập tài khoản.",true);return}
      toast("Không thể tạo profile nếu Auth user chưa tồn tại.",true);return;
    }
    if(r.error){toast(r.error.message,true);return}closeModal();toast("Đã lưu.");go("students");
  });
}
async function teacherForm(id=null){
  const p=id?cache.profiles.find(x=>x.id===id):null;
  openModal(p?"Sửa giáo viên":"Thêm hồ sơ giáo viên",`
    <div class="grid2"><div class="field"><label>Họ và tên</label><input id="f_full" value="${esc(p?.full_name)}"></div>
    <div class="field"><label>Username</label><input id="f_login" value="${esc(p?.login_name)}" ${p?"disabled":""}></div></div>

function tablePage(title,sub,tools,headers,rows){
 return `<div class="page-head"><div><div class="page-title">${title}</div><div class="page-sub">${sub}</div></div><div class="tools">${tools||""}</div></div>
 <div class="panel"><div class="table-wrap">${rows.length?`<table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table>`:`<div class="empty">Chưa có dữ liệu.</div>`}</div></div>`;
}
function actions(edit,del){return `<button class="btn btn-light btn-sm" onclick="${edit}">Sửa</button> <button class="btn btn-danger btn-sm" onclick="${del}">Xóa</button>`}
async function deleteRow(table,id,label){
 if(!confirm(`Xóa ${label} này?\n\nĐây là DELETE thật trong database. Chỉ xác nhận nếu bạn chắc chắn.`))return;
 const {error}=await db.from(table).delete().eq("id",id);if(error){toast(error.message,true);return}toast("Đã xóa.");go(currentPage);
}

db.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_OUT"){document.getElementById("login").style.display="grid";document.getElementById("app").style.display="none"}
});
boot();
